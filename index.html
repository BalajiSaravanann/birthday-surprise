<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Special</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI,sans-serif;
}

body{
  background:
    linear-gradient(135deg, rgba(111,107,220,0.6), rgba(139,130,230,0.6)),
    url('background.png') no-repeat center center fixed;
  background-size:cover;
  overflow-x:hidden;
}

/* 🔥 CARD CONTENT FULL BLACK */
.card{
  margin:80px auto;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(10px);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:420px;
  text-align:center;
  animation:pop 1s ease;
  color:#000; /* Entire card text black */
}

/* Cursor also black */
.cursor{
  display:inline-block;
  width:2px;
  background:black;
  margin-left:4px;
  animation:blink 0.7s infinite;
}

.special{
  font-size:13px;
  letter-spacing:2px;
  margin-bottom:8px;
}

@keyframes pop{
  from{transform:scale(0.9);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

/* TITLE */
.main-title{
  font-size:clamp(18px,3.5vw,24px);
  text-align:center;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  line-height:1.3;
}

/* Hint */
#hintMessage{
  margin-top:8px;
  font-size:14px;
  opacity:0.9;
  transition:0.5s ease;
}

.fade-out{
  opacity:0;
  transform:translateY(-5px);
}

/* Typing */
#typingText{
  margin-top:15px;
  white-space:pre-line;
  line-height:1.6;
  min-height:140px;
}

/* 🔥 GLOW BUTTON */
#playBtn{
  margin:15px auto 0;
  display:block;
  padding:10px 20px;
  border-radius:25px;
  border:2px solid rgba(0,0,0,0.6);
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(8px);
  color:black;
  cursor:pointer;
  font-size:14px;
  transition:0.3s;
  position:relative;
  animation:glow 1.5s infinite alternate;
}

/* Glow Animation */
@keyframes glow{
  from{
    box-shadow:0 0 5px rgba(0,0,0,0.4),
               0 0 10px rgba(0,0,0,0.3);
  }
  to{
    box-shadow:0 0 15px rgba(0,0,0,0.7),
               0 0 25px rgba(0,0,0,0.6);
  }
}

#playBtn:hover{
  transform:scale(1.05);
}

/* ---------------- HEART SECTION ---------------- */
.heart-section{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  opacity:0;
  transform:translateY(80px);
  transition:1.5s ease;
}

.heart-section.show{
  opacity:1;
  transform:translateY(0);
}

.heart-wrapper{
  position:relative;
  width:420px;
  height:380px;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

svg{
  position:absolute;
  width:100%;
  height:100%;
}

.heart-path{
  fill:none;
  stroke:white;
  stroke-width:4;
  stroke-dasharray:1500;
  stroke-dashoffset:1500;
  animation:draw 4s ease forwards;
}

@keyframes draw{
  to{stroke-dashoffset:0;}
}

.timer-content{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:white;
}

#timer{
  line-height:1.6;
  font-size:18px;
}

/* Falling hearts */
.fall-heart{
  position:fixed;
  top:-20px;
  font-size:20px;
  opacity:0.8;
  animation:fall linear infinite;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}

#fireworksCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:999;
}
</style>
</head>
