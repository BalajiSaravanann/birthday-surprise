<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Special</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI,sans-serif;
}

body{
  background:
    linear-gradient(135deg, rgba(111,107,220,0.6), rgba(139,130,230,0.6)),
    url('background.png') no-repeat center center fixed;
  background-size:cover;
  color:white;
  overflow-x:hidden;
}

/* ---------- INTRO ---------- */

#introScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:2000;
}

#introVideo{
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;
}

#startVideoBtn, #enterBtn{
  position:absolute;
  padding:12px 28px;
  font-size:16px;
  border:none;
  border-radius:30px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(8px);
  color:white;
  cursor:pointer;
}

#startVideoBtn{ bottom:120px; }
#enterBtn{ bottom:60px; display:none; }

/* ---------- CARD ---------- */

.card{
  margin:80px auto;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(10px);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:420px;
  text-align:center;
  animation:pop 1s ease;
}

@keyframes pop{
  from{transform:scale(0.9);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

.main-title{
  font-size:clamp(18px,3.5vw,24px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

#typingText{
  margin-top:15px;
  white-space:pre-line;
  line-height:1.6;
  min-height:140px;
}

.cursor{
  display:inline-block;
  width:2px;
  background:white;
  animation:blink 0.7s infinite;
}

@keyframes blink{50%{opacity:0;}}

#playBtn{
  margin-top:15px;
  padding:10px 20px;
  border-radius:25px;
  border:none;
  background:rgba(255,255,255,0.2);
  color:white;
  cursor:pointer;
}

/* ---------- HEART SECTION ---------- */

.heart-section{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;

  opacity:0;
  transform:translateY(80px);
  transition:1.2s ease;
}

.heart-section.show{
  opacity:1;
  transform:translateY(0);
}

.heart-wrapper{
  position:relative;
  width:380px;
  height:340px;
}

svg{
  width:100%;
  height:100%;
}

.heart-path{
  fill:none;
  stroke:white;
  stroke-width:4;
}

.timer-content{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#timer{
  font-size:18px;
}

/* Falling hearts */
.fall-heart{
  position:fixed;
  top:-20px;
  font-size:20px;
  animation:fall linear infinite;
}

@keyframes fall{
  to{transform:translateY(110vh);}
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="introScreen">
  <video id="introVideo" playsinline>
    <source src="intro.mp4" type="video/mp4">
  </video>
  <button id="startVideoBtn">Tap to Start 🎬</button>
  <button id="enterBtn">Tap the Screen 🤍</button>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <h1 class="main-title">
    <span>🧚</span>
    <span>Happy Birthday Thangachii</span>
    <span>🧚</span>
  </h1>

  <h2>Athifa Kouser A</h2>

  <p id="typingText"></p>

  <button id="playBtn">▶ Play Music</button>
</div>

<!-- HEART TIMER -->
<div class="heart-section" id="heartSection">
  <div class="heart-wrapper">
    <svg viewBox="0 0 512 512">
      <path class="heart-path"
        d="M256 472
           L56 272
           A120 120 0 0 1 256 120
           A120 120 0 0 1 456 272
           Z"/>
    </svg>
    <div class="timer-content">
      <h3>So, En Thangachii ku ♡</h3>
      <div id="timer"></div>
    </div>
  </div>
</div>

<script>

/* INTRO LOGIC */
const introVideo=document.getElementById("introVideo");
const startVideoBtn=document.getElementById("startVideoBtn");
const enterBtn=document.getElementById("enterBtn");
const introScreen=document.getElementById("introScreen");

startVideoBtn.onclick=()=>{
  introVideo.play();
  startVideoBtn.style.display="none";
};

introVideo.onended=()=>{
  enterBtn.style.display="block";
};

enterBtn.onclick=()=>{
  introScreen.style.display="none";
};

/* MUSIC + MESSAGE */
const music=document.getElementById("bgMusic");
const playBtn=document.getElementById("playBtn");
const typingElement=document.getElementById("typingText");

const message=`Thangachii, INIYA PIRANDHA NAAL NALVAZHTHUKAL 🤍
Ne epaum sandhosama iru.
Healthy ah iru.
2026 namadhey 😌`;

let i=0;
function typeWriter(){
  if(i<message.length){
    typingElement.innerHTML+=message.charAt(i);
    i++;
    setTimeout(typeWriter,100);
  }
}

playBtn.onclick=()=>{
  music.play();
  typeWriter();
  playBtn.style.display="none";
};

/* SCROLL CONTROL HEART */
const heartSection=document.getElementById("heartSection");

window.addEventListener("scroll",()=>{
  const triggerPoint=window.innerHeight*0.8;
  const heartTop=heartSection.getBoundingClientRect().top;

  if(heartTop<triggerPoint){
    heartSection.classList.add("show");
  }else{
    heartSection.classList.remove("show");
  }
});

/* TIMER */
let birthDate=new Date("February 28, 2004 23:50:00").getTime();
function updateTimer(){
  let now=new Date().getTime();
  let diff=now-birthDate;
  let s=Math.floor(diff/1000)%60;
  let m=Math.floor(diff/(1000*60))%60;
  let h=Math.floor(diff/(1000*60*60))%24;
  let d=Math.floor(diff/(1000*60*60*24));
  document.getElementById("timer").innerHTML=
    d+" Days<br>"+h+" Hours<br>"+m+" Minutes<br>"+s+" Seconds";
}
setInterval(updateTimer,1000);
updateTimer();

/* Falling Hearts */
function createHeart(){
  let h=document.createElement("div");
  h.className="fall-heart";
  h.innerHTML="🤍";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(5+Math.random()*5)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
}
setInterval(createHeart,800);

</script>
</body>
</html>
