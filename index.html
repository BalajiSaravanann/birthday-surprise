<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Special</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif;}

body{
  background: 
    linear-gradient(135deg, rgba(111,107,220,0.6), rgba(139,130,230,0.6)),
    url('background.png') no-repeat center center fixed;
  background-size: cover;
  color:white;
  overflow-x:hidden;
}

/* CARD */
.card{
  margin:80px auto;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(10px);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:420px;
  text-align:center;
  animation:pop 1s ease;
}

@keyframes pop{
  from{transform:scale(0.9);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

/* HEART SECTION */

.heart-section{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  opacity:0;
  transform:translateY(80px);
  transition:1.5s ease;
}

.heart-section.show{
  opacity:1;
  transform:translateY(0);
}

.heart-wrapper{
  position:relative;
  width:500px;
  height:500px;
}

#pinkboard{
  position:absolute;
  width:100%;
  height:100%;
}

.timer-content{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
}

#timer{
  line-height:1.6;
  font-size:18px;
}
</style>
</head>

<body>

<div class="card">
  <h1>🧚 Happy Birthday Thangachii 🧚</h1>
  <h2>Athifa Kouser A</h2>
  <p>Your anna will always be with you 🖤</p>
</div>

<div class="heart-section">
  <div class="heart-wrapper">
    <canvas id="pinkboard"></canvas>
    <div class="timer-content">
      <h3>En Thangachii 🧚🏻‍♀️</h3>
      <div id="timer"></div>
    </div>
  </div>
</div>

<script>

/* SHOW HEART SECTION */
window.addEventListener("load", function(){
  document.querySelector(".heart-section").classList.add("show");
});

/* PARTICLE HEART ENGINE */

var settings = {
  particles:{ length:500,duration:2,velocity:100,effect:-0.75,size:30 }
};

(function(){
  var canvas = document.getElementById("pinkboard");
  var context = canvas.getContext("2d");

  function resize(){
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  window.addEventListener("resize",resize);
  resize();

  function Point(x,y){ this.x=x||0; this.y=y||0; }
  Point.prototype.clone=function(){ return new Point(this.x,this.y); }
  Point.prototype.length=function(length){
    if(length===undefined)
      return Math.sqrt(this.x*this.x+this.y*this.y);
    this.normalize();
    this.x*=length; this.y*=length;
    return this;
  }
  Point.prototype.normalize=function(){
    var length=this.length();
    this.x/=length; this.y/=length;
    return this;
  }

  function Particle(){
    this.position=new Point();
    this.velocity=new Point();
    this.acceleration=new Point();
    this.age=0;
  }

  Particle.prototype.initialize=function(x,y,dx,dy){
    this.position.x=x;
    this.position.y=y;
    this.velocity.x=dx;
    this.velocity.y=dy;
    this.acceleration.x=dx*settings.particles.effect;
    this.acceleration.y=dy*settings.particles.effect;
    this.age=0;
  }

  Particle.prototype.update=function(deltaTime){
    this.position.x+=this.velocity.x*deltaTime;
    this.position.y+=this.velocity.y*deltaTime;
    this.velocity.x+=this.acceleration.x*deltaTime;
    this.velocity.y+=this.acceleration.y*deltaTime;
    this.age+=deltaTime;
  }

  Particle.prototype.draw=function(context,image){
    function ease(t){ return (--t)*t*t+1; }
    var size=image.width*ease(this.age/settings.particles.duration);
    context.globalAlpha=1-this.age/settings.particles.duration;
    context.drawImage(image,
      this.position.x-size/2,
      this.position.y-size/2,
      size,size);
  }

  function ParticlePool(length){
    this.particles=new Array(length);
    for(var i=0;i<length;i++)
      this.particles[i]=new Particle();
    this.firstActive=0;
    this.firstFree=0;
  }

  ParticlePool.prototype.add=function(x,y,dx,dy){
    this.particles[this.firstFree].initialize(x,y,dx,dy);
    this.firstFree=(this.firstFree+1)%this.particles.length;
    if(this.firstActive==this.firstFree)
      this.firstActive=(this.firstActive+1)%this.particles.length;
  }

  ParticlePool.prototype.update=function(deltaTime){
    if(this.firstActive<this.firstFree){
      for(var i=this.firstActive;i<this.firstFree;i++)
        this.particles[i].update(deltaTime);
    }else{
      for(var i=this.firstActive;i<this.particles.length;i++)
        this.particles[i].update(deltaTime);
      for(var i=0;i<this.firstFree;i++)
        this.particles[i].update(deltaTime);
    }

    while(this.particles[this.firstActive].age>=settings.particles.duration
          && this.firstActive!=this.firstFree){
      this.firstActive=(this.firstActive+1)%this.particles.length;
    }
  }

  ParticlePool.prototype.draw=function(context,image){
    if(this.firstActive<this.firstFree){
      for(var i=this.firstActive;i<this.firstFree;i++)
        this.particles[i].draw(context,image);
    }else{
      for(var i=this.firstActive;i<this.particles.length;i++)
        this.particles[i].draw(context,image);
      for(var i=0;i<this.firstFree;i++)
        this.particles[i].draw(context,image);
    }
  }

  function pointOnHeart(t){
    return new Point(
      160*Math.pow(Math.sin(t),3),
      130*Math.cos(t)
      -50*Math.cos(2*t)
      -20*Math.cos(3*t)
      -10*Math.cos(4*t)+25
    );
  }

  var image=(function(){
    var canvas=document.createElement("canvas");
    var ctx=canvas.getContext("2d");
    canvas.width=settings.particles.size;
    canvas.height=settings.particles.size;

    function to(t){
      var p=pointOnHeart(t);
      p.x=settings.particles.size/2+p.x*settings.particles.size/350;
      p.y=settings.particles.size/2-p.y*settings.particles.size/350;
      return p;
    }

    ctx.beginPath();
    var t=-Math.PI;
    var p=to(t);
    ctx.moveTo(p.x,p.y);
    while(t<Math.PI){
      t+=0.01;
      p=to(t);
      ctx.lineTo(p.x,p.y);
    }
    ctx.closePath();
    ctx.fillStyle="#ff2da0";
    ctx.fill();

    var img=new Image();
    img.src=canvas.toDataURL();
    return img;
  })();

  var particles=new ParticlePool(settings.particles.length);
  var particleRate=settings.particles.length/settings.particles.duration;
  var time;

  function render(){
    requestAnimationFrame(render);
    var newTime=new Date().getTime()/1000;
    var deltaTime=newTime-(time||newTime);
    time=newTime;

    context.clearRect(0,0,canvas.width,canvas.height);

    var amount=particleRate*deltaTime;
    for(var i=0;i<amount;i++){
      var pos=pointOnHeart(Math.PI-2*Math.PI*Math.random());
      var dir=pos.clone().length(settings.particles.velocity);
      particles.add(
        canvas.width/2+pos.x,
        canvas.height/2-pos.y,
        dir.x,-dir.y);
    }

    particles.update(deltaTime);
    particles.draw(context,image);
  }

  render();
})();

/* TIMER */

let birthDate=new Date("February 28, 2004 23:50:00").getTime();

function updateTimer(){
  let now=new Date().getTime();
  let diff=now-birthDate;
  let s=Math.floor(diff/1000)%60;
  let m=Math.floor(diff/(1000*60))%60;
  let h=Math.floor(diff/(1000*60*60))%24;
  let d=Math.floor(diff/(1000*60*60*24));

  document.getElementById("timer").innerHTML=
    d+" Days<br>"+h+" Hours<br>"+m+" Minutes<br>"+s+" Seconds";
}
setInterval(updateTimer,1000);
updateTimer();

</script>
</body>
</html>
