<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday Special</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:linear-gradient(to bottom,#1a0026,#32004d);
  font-family: 'Segoe UI', sans-serif;
  overflow-x:hidden;
  color:white;
  text-align:center;
}

/* Floating petals */
.petal{
  position:fixed;
  width:20px;
  height:20px;
  background:url('https://pngimg.com/uploads/flower/flower_PNG102.png');
  background-size:cover;
  animation:float 12s linear infinite;
  opacity:0.7;
}

@keyframes float{
  0%{transform:translateY(-100px) rotate(0deg);}
  100%{transform:translateY(100vh) rotate(360deg);}
}

/* Heart Container */
.heart-wrapper{
  margin-top:120px;
  opacity:0;
  transform:translateY(80px);
  transition:1.5s;
}

.heart-wrapper.show{
  opacity:1;
  transform:translateY(0);
}

.heart{
  position:relative;
  width:320px;
  height:290px;
  margin:auto;
}

.heart:before,
.heart:after{
  content:"";
  position:absolute;
  width:160px;
  height:260px;
  background:url('https://pngimg.com/uploads/rose/rose_PNG66699.png');
  background-size:cover;
  border-radius:160px 160px 0 0;
}

.heart:before{
  left:160px;
  transform:rotate(-45deg);
  transform-origin:0 100%;
}

.heart:after{
  left:0;
  transform:rotate(45deg);
  transform-origin:100% 100%;
}

/* Timer */
.timer{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:250px;
  font-size:18px;
  line-height:30px;
}

/* Pulse effect */
@keyframes pulse{
  0%{transform:translate(-50%,-50%) scale(1);}
  50%{transform:translate(-50%,-50%) scale(1.05);}
  100%{transform:translate(-50%,-50%) scale(1);}
}

.timer{
  animation:pulse 2s infinite;
}

/* Music button */
#musicBtn{
  position:fixed;
  top:20px;
  right:20px;
  padding:10px 18px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:30px;
  color:white;
  cursor:pointer;
  z-index:1000;
}

/* Fireworks */
canvas{
  position:fixed;
  top:0;
  left:0;
  pointer-events:none;
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn">▶ Play Music</button>

<div class="heart-wrapper" id="heartSection">
  <h2>Born Since 💖</h2>
  <div class="heart">
    <div class="timer" id="timer"></div>
  </div>
</div>

<canvas id="fireworks"></canvas>

<script>

/* Floating petals */
for(let i=0;i<25;i++){
  let petal=document.createElement("div");
  petal.className="petal";
  petal.style.left=Math.random()*100+"vw";
  petal.style.animationDuration=(8+Math.random()*10)+"s";
  document.body.appendChild(petal);
}

/* Timer */
const birthDate = new Date("February 28, 2004 23:50:00").getTime();

setInterval(()=>{
  const now = new Date().getTime();
  const diff = now - birthDate;

  const days = Math.floor(diff/(1000*60*60*24));
  const hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
  const mins = Math.floor((diff%(1000*60*60))/(1000*60));
  const secs = Math.floor((diff%(1000*60))/1000);

  document.getElementById("timer").innerHTML =
    days+" Days<br>"+
    hours+" Hours<br>"+
    mins+" Minutes<br>"+
    secs+" Seconds";
},1000);

/* Scroll fade */
window.addEventListener("scroll",()=>{
  document.getElementById("heartSection").classList.add("show");
});
window.onload=()=>{
  document.getElementById("heartSection").classList.add("show");
}

/* Music */
const music=document.getElementById("bgMusic");
const btn=document.getElementById("musicBtn");

btn.addEventListener("click",()=>{
  music.play();
  btn.style.display="none";
});

/* Fireworks at 12:05 AM */
function checkFireworks(){
  const now=new Date();
  if(now.getHours()===0 && now.getMinutes()===5){
    startFireworks();
  }
}
setInterval(checkFireworks,60000);

/* Simple fireworks */
const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function startFireworks(){
  for(let i=0;i<100;i++){
    let x=Math.random()*canvas.width;
    let y=Math.random()*canvas.height;
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(x,y,2,0,Math.PI*2);
    ctx.fill();
  }
  setTimeout(()=>ctx.clearRect(0,0,canvas.width,canvas.height),3000);
}

</script>

</body>
</html>
