<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Special</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI,sans-serif;
}

body{
  background:
    linear-gradient(135deg, rgba(111,107,220,0.6), rgba(139,130,230,0.6)),
    url('background.png') no-repeat center center fixed;
  background-size:cover;
  color:white;
  overflow-x:hidden;
}

/* ---------- INTRO SCREEN ---------- */

#introScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:2000;
}

#introVideo{
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;
}

#startVideoBtn, #enterBtn{
  position:absolute;
  padding:12px 28px;
  font-size:16px;
  border:none;
  border-radius:30px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(8px);
  color:white;
  cursor:pointer;
  transition:0.3s;
}

#startVideoBtn{ bottom:120px; }
#enterBtn{ bottom:60px; display:none; }

#startVideoBtn:hover,
#enterBtn:hover{
  background:rgba(255,255,255,0.4);
}

/* ---------- CARD ---------- */

.card{
  margin:80px auto;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(10px);
  padding:30px;
  border-radius:20px;
  width:90%;
  max-width:420px;
  text-align:center;
  animation:pop 1s ease;
}

.special{
  font-size:13px;
  letter-spacing:2px;
  margin-bottom:8px;
}

@keyframes pop{
  from{transform:scale(0.9);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

.main-title{
  font-size:clamp(18px,3.5vw,24px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

#hintMessage{
  margin-top:8px;
  font-size:14px;
  opacity:0.9;
  transition:0.5s ease;
}

.fade-out{
  opacity:0;
  transform:translateY(-5px);
}

#typingText{
  margin-top:15px;
  white-space:pre-line;
  line-height:1.6;
  min-height:140px;
}

.cursor{
  display:inline-block;
  width:2px;
  background:white;
  margin-left:4px;
  animation:blink 0.7s infinite;
}

@keyframes blink{
  50%{opacity:0;}
}

#playBtn{
  margin:15px auto 0;
  padding:10px 20px;
  border-radius:25px;
  border:1px solid rgba(255,255,255,0.6);
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(8px);
  color:white;
  cursor:pointer;
  font-size:14px;
}

/* ---------- HEART SECTION ---------- */

.heart-section{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  opacity:0;
  transform:translateY(80px);
  transition:1.5s ease;
}

.heart-section.show{
  opacity:1;
  transform:translateY(0);
}

.heart-wrapper{
  position:relative;
  width:420px;
  height:380px;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.05);}
}

svg{
  position:absolute;
  width:100%;
  height:100%;
}

.heart-path{
  fill:none;
  stroke:white;
  stroke-width:4;
  stroke-dasharray:1500;
  stroke-dashoffset:1500;
  animation:draw 4s ease forwards;
}

@keyframes draw{
  to{stroke-dashoffset:0;}
}

.timer-content{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

#timer{
  line-height:1.6;
  font-size:18px;
}

.fall-heart{
  position:fixed;
  top:-20px;
  font-size:20px;
  opacity:0.8;
  animation:fall linear infinite;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}

#fireworksCanvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:999;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="introScreen">
  <video id="introVideo" playsinline>
    <source src="intro.mp4" type="video/mp4">
  </video>
  <button id="startVideoBtn">Tap to Start 🎬</button>
  <button id="enterBtn">Tap the Screen 🤍</button>
</div>

<canvas id="fireworksCanvas"></canvas>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card">
  <div class="special">Special Wishes from AKB_ Fam</div>

  <h1 class="main-title">
    <span>🧚</span>
    <span>Happy Birthday Thangachii</span>
    <span>🧚</span>
  </h1>

  <h2>Athifa Kouser A</h2>

  <div id="hintMessage">
    Enna da pakura, screen scroll panama play music button press panu 😅
  </div>

  <p id="typingText"></p>

  <p>Made with love, Respect & Gratitude 🖤</p>
  <button id="playBtn">▶ Play Music</button>
</div>

<div class="heart-section">
  <div class="heart-wrapper">
    <svg viewBox="0 0 512 512">
      <path class="heart-path"
        d="M256 472
           L56 272
           A120 120 0 0 1 256 120
           A120 120 0 0 1 456 272
           Z"/>
    </svg>
    <div class="timer-content">
      <h3>So, En Thangachii ku ♡</h3>
      <div id="timer"></div>
    </div>
  </div>
</div>

<script>

/* ---------- INTRO LOGIC ---------- */

const introVideo = document.getElementById("introVideo");
const startVideoBtn = document.getElementById("startVideoBtn");
const enterBtn = document.getElementById("enterBtn");
const introScreen = document.getElementById("introScreen");

startVideoBtn.addEventListener("click",()=>{
  introVideo.play();
  startVideoBtn.style.display="none";
});

introVideo.addEventListener("ended",()=>{
  enterBtn.style.display="block";
});

enterBtn.addEventListener("click",()=>{
  introScreen.style.display="none";
});

/* ---------- MAIN LOGIC ---------- */

const music=document.getElementById("bgMusic");
const playBtn=document.getElementById("playBtn");
const typingElement=document.getElementById("typingText");
const hint=document.getElementById("hintMessage");

const message = `Thangachii, INIYA PIRANDHA NAAL NALVAZHTHUKAL. Daii, apro vera enna wish panradhunu thrla daa🤣.
Ana na epaum solradhu dha daa; Ne epaum sandhosama smiley face oda iru,
romba romba mukiyama healthy ah iru😌.

Wishing you the best today and everyday. You deserved it and once again Happy Birthday thoo Youu!!

2026 Namadhey😌
Unakaga epaum na iurpen daa 🖤`;

let charIndex=0;
let typingStarted=false;

function typeWriter(){
  if(charIndex < message.length){
    typingElement.innerHTML += message.charAt(charIndex);
    charIndex++;
    setTimeout(typeWriter,120);
  }else{
    typingElement.innerHTML += '<span class="cursor"></span>';
  }
}

playBtn.addEventListener("click",()=>{
  music.volume=0.6;
  music.play();
  playBtn.style.display="none";
  hint.classList.add("fade-out");
  setTimeout(()=>hint.style.display="none",500);
  if(!typingStarted){
    typingStarted=true;
    typeWriter();
  }
});

/* Hearts */
function createHeart(){
  let h=document.createElement("div");
  h.className="fall-heart";
  h.innerHTML=Math.random()>0.5?"🖤":"🤍";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(5+Math.random()*6)+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),11000);
}
setInterval(createHeart,800);

/* STRICT 100% BOTTOM SCROLL LOGIC */
const heartSection=document.querySelector(".heart-section");

window.addEventListener("scroll",()=>{
  const scrollPosition=window.innerHeight + window.scrollY;
  const pageHeight=document.documentElement.scrollHeight;

  if(scrollPosition >= pageHeight - 2){
    heartSection.classList.add("show");
  }else{
    heartSection.classList.remove("show");
  }
});

/* Timer */
let birthDate=new Date("February 28, 2004 23:50:00").getTime();
function updateTimer(){
  let now=new Date().getTime();
  let diff=now-birthDate;
  let s=Math.floor(diff/1000)%60;
  let m=Math.floor(diff/(1000*60))%60;
  let h=Math.floor(diff/(1000*60*60))%24;
  let d=Math.floor(diff/(1000*60*60*24));
  document.getElementById("timer").innerHTML=
    d+" Days<br>"+h+" Hours<br>"+m+" Minutes<br>"+s+" Seconds";
}
setInterval(updateTimer,1000);
updateTimer();

/* Fireworks */
const canvas=document.getElementById("fireworksCanvas");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
let particles=[];

function createFirework(x,y){
  for(let i=0;i<80;i++){
    particles.push({
      x,y,
      angle:Math.random()*2*Math.PI,
      speed:Math.random()*5+2
    });
  }
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach((p,i)=>{
    p.x+=Math.cos(p.angle)*p.speed;
    p.y+=Math.sin(p.angle)*p.speed;
    p.speed*=0.96;
    ctx.beginPath();
    ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
    if(p.speed<0.5)particles.splice(i,1);
  });
  requestAnimationFrame(animate);
}

canvas.addEventListener("click",(e)=>{
  createFirework(e.clientX,e.clientY);
});

animate();

</script>

</body>
</html>
